; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cores3]
platform = espressif32@7.0.0
board = m5stack-cores3
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.filesystem = spiffs
board_build.partitions = default_16MB.csv
build_unflags = 
	-std=gnu++11
build_flags = 
	-O2
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=0
	-DUART_SCLK_DEFAULT=UART_SCLK_APB
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
lib_deps =
	m5stack/M5Unified@0.2.15
	bblanchon/ArduinoJson@7.4.3
	M5GFX@0.2.21
	m5stack/StackChan-BSP@1.1.0
	bitbank2/AnimatedGIF@2.2.3
lib_ldf_mode = deep
check_tool = cppcheck
check_skip_packages = yes
check_flags = 
	cppcheck: --enable=warning,style,performance,portability
	cppcheck: --suppress=*:*/.pio/libdeps/*
	cppcheck: --suppress=*:src/drivers/*

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_flags = 
	-std=gnu++17
	-Isrc
build_src_filter = 
	+<wav_parser.cpp>
	+<face_names.cpp>
lib_deps = bitbank2/AnimatedGIF@2.2.3
