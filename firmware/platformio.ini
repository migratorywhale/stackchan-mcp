; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cores3]
platform = espressif32@7.0.0
board = m5stack-cores3
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.filesystem = spiffs
board_build.partitions = default_16MB.csv
extra_scripts = pre:scripts/websocket_limits.py
build_unflags = 
	-std=gnu++11
build_flags = 
	-O2
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=0
	-DUART_SCLK_DEFAULT=UART_SCLK_APB
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DNODEBUG_WEBSOCKETS
	-DWEBSOCKETS_TCP_TIMEOUT=2000
	-DWEBSOCKETS_MAX_DATA_SIZE=131108
lib_deps =
	m5stack/M5Unified@0.2.15
	bblanchon/ArduinoJson@7.4.3
	; M5GFX 0.2.21 (pinned to the tag's commit SHA)
	https://github.com/m5stack/M5GFX.git#5268353cffabd2925b87ed9bcc05ded4e22cc3d1
	https://github.com/m5stack/StackChan-BSP.git#0addef4cf51d9f26c86ac553f0fdd2832d19a5e5
	bitbank2/AnimatedGIF@2.2.3
	links2004/WebSockets@2.7.2
lib_ldf_mode = deep
check_tool = cppcheck
check_skip_packages = yes
check_flags = 
	cppcheck: --enable=warning,style,performance,portability
	cppcheck: --suppress=*:*/.pio/libdeps/*
	cppcheck: --suppress=*:src/drivers/*

[env:m5stack-cores3-public]
extends = env:m5stack-cores3
build_flags =
	${env:m5stack-cores3.build_flags}
	-DSTACKCHAN_USE_PUBLIC_CONFIG

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_flags = 
	-std=gnu++17
	-Isrc
	-Itest/support
	-DSTACKCHAN_USE_PUBLIC_CONFIG
build_src_filter = 
	+<wav_parser.cpp>
	+<face_names.cpp>
	+<outbound_protocol.cpp>
lib_deps =
	bitbank2/AnimatedGIF@2.2.3
	bblanchon/ArduinoJson@7.4.3
